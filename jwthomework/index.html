<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Demo lưu JWT 3 chỗ</title>
</head>
<body>
  <h1>Đăng nhập để lấy JWT</h1>
  <form id="loginForm">
    <input type="text" id="username" placeholder="admin" value="admin" />
    <input type="password" id="password" placeholder="123456" value="123456" />
    <button type="submit">Đăng nhập</button>
  </form>

  <pre id="result"></pre>

  <script>
    const form = document.getElementById('loginForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include', 
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      result.textContent = JSON.stringify(data, null, 2);

      if (res.ok) {
        const token = data.token;

        // 1. Lưu localStorage
        localStorage.setItem('jwt_local', token);

        // 2. Lưu sessionStorage
        sessionStorage.setItem('jwt_session', token);

        // 3. Lưu cookie bằng JS
        document.cookie = `jwt_js=${token}; path=/; max-age=3600`;

        console.log('Đã lưu token vào 3 chỗ');
      }
    });
  </script>
</body>
</html>
